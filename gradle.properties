# Xmx bajo a propósito: esta máquina de desarrollo tiene 3 GB de RAM total.
# Con -Xmx4096m el daemon de Gradle pedía más memoria nativa de la que existe
# en la máquina y terminaba crasheando la JVM (hs_err_pid*.log, "Out of
# Memory Error", tras ~80 minutos colgado). org.gradle.parallel=false y
# workers.max=1 evitan que se levanten varios workers en simultáneo, que es
# lo que más memoria consume en una build multi-módulo como esta.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
# in-process en vez de un Kotlin daemon aparte: con el emulador corriendo a
# la vez, sumar un segundo proceso JVM (el compile daemon) es lo que lo
# hacia morir apenas arrancaba ("terminated unexpectedly ... error code: 0").
# Compila mas lento pero dentro del propio daemon de Gradle, sin proceso extra.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
