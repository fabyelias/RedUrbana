name: Build debug APK

# Pensado para instalar en la tablet sin PC ni cable USB: cada push a main
# genera un APK debug descargable desde la pestaña "Actions" de GitHub, en
# el navegador de la propia tablet (Settings → Actions → runs → el más
# reciente → sección Artifacts, al final de la página).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      # Los dos .xml con el token PÚBLICO (pk.*) de Mapbox están gitignoreados
      # (ver docs/CREDENTIALS_SETUP.md sección 2) — se generan acá a partir
      # del secret MAPBOX_PUBLIC_TOKEN, igual que cada dev los completa a
      # mano desde los .example en su máquina.
      - name: Generar recursos de Mapbox (token público)
        run: |
          mkdir -p app/src/main/res/values core/core-common/src/main/res/values
          cat > app/src/main/res/values/mapbox.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="mapbox_access_token" translatable="false">${MAPBOX_PUBLIC_TOKEN}</string>
          </resources>
          EOF
          cat > core/core-common/src/main/res/values/mapbox_token.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="mapbox_public_token" translatable="false">${MAPBOX_PUBLIC_TOKEN}</string>
          </resources>
          EOF
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}

      - run: chmod +x gradlew

      # ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: Gradle mapea automáticamente
      # cualquier env var con ese prefijo a la project property homónima que
      # settings.gradle.kts lee para autenticar el repo privado de Mapbox.
      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --no-daemon
        env:
          ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: redurbana-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
